name: NexQuant CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        python -m pip install python-dotenv>=0.19.0
        python -m pip install schedule>=1.1.0
        python -m pip install pytest pytest-mock pytest-cov
        python -m pip install -r requirements.txt
        python -m pip install -e .
        
    - name: Run Tests (including Chaos Engineering)
      env:
        PYTHONPATH: .
        # « paper » n'est pas un broker valide (binance/alpaca/mt5) ; BACKTEST_MODE
        # court-circuite la validation des identifiants broker dans superbot.config.
        BACKTEST_MODE: "true"
      run: |
        pytest tests/ -v --cov=superbot --cov-report=xml
        
    - name: Upload coverage reports
      uses: codecov/codecov-action@v3
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
